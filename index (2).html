<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Demo — Agente de WhatsApp | Hamburgueria</title>
<style>
  :root{
    --wa-header: #075E54;
    --wa-header-dark: #054C40;
    --wa-bg: #E5DDD5;
    --wa-bubble-in: #FFFFFF;
    --wa-bubble-out: #DCF8C6;
    --wa-text: #111B21;
    --wa-subtext: #667781;
    --wa-accent: #25D366;
    --wa-tick: #53BDEB;
    --receipt-bg: #FFF9E8;
    --receipt-border: #E8DDB5;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0B141A;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 24px 12px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .brand-logo{
    width:34px;
    height:34px;
    border-radius:50%;
    flex-shrink:0;
  }
  .brand-name{
    color:#F2F7FC;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.4px;
  }
  .caption{
    color:#8696A0;
    font-size:12.5px;
    margin-bottom:18px;
    letter-spacing:0.3px;
    text-align:center;
  }
  .phone{
    width: 380px;
    max-width: 94vw;
    height: 720px;
    max-height: 88vh;
    background: var(--wa-bg);
    border-radius: 32px;
    border: 8px solid #000;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    position:relative;
  }
  .header{
    background: var(--wa-header);
    color:white;
    padding: 14px 16px 12px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background: linear-gradient(135deg,#FF7A45,#D9481E);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }
  .header .info{ line-height:1.25; }
  .header .name{ font-size:15.5px; font-weight:600; }
  .header .status{ font-size:12px; color:#CFE9E4; }
  .chat{
    flex:1;
    overflow-y:auto;
    padding: 14px 10px 10px;
    background-image: radial-gradient(circle at 20% 20%, rgba(0,0,0,0.02) 0, transparent 50%);
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .bubble{
    max-width: 82%;
    padding: 7px 9px 8px;
    border-radius: 8px;
    font-size: 14.2px;
    line-height:1.35;
    position:relative;
    box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
    animation: pop .18s ease-out;
    white-space:pre-wrap;
  }
  @keyframes pop{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  .in{
    background: var(--wa-bubble-in);
    align-self:flex-start;
    border-top-left-radius:0;
    color: var(--wa-text);
  }
  .out{
    background: var(--wa-bubble-out);
    align-self:flex-end;
    border-top-right-radius:0;
    color: var(--wa-text);
  }
  .meta{
    font-size:10.5px;
    color:var(--wa-subtext);
    text-align:right;
    margin-top:3px;
    display:flex;
    gap:3px;
    justify-content:flex-end;
    align-items:center;
  }
  .tick{ color: var(--wa-tick); font-size:12px; }
  .receipt{
    background: var(--receipt-bg);
    border: 1px dashed var(--receipt-border);
    align-self:flex-start;
    border-radius: 8px;
    max-width: 88%;
    font-size:13.3px;
  }
  .receipt-title{
    font-weight:700;
    font-size:13.5px;
    border-bottom: 1px dashed var(--receipt-border);
    padding-bottom:5px;
    margin-bottom:5px;
    display:flex;
    justify-content:space-between;
  }
  .receipt-row{ display:flex; justify-content:space-between; padding:1.5px 0; }
  .receipt-total{
    border-top: 1px dashed var(--receipt-border);
    margin-top:5px;
    padding-top:5px;
    font-weight:700;
    display:flex;
    justify-content:space-between;
  }
  .typing{
    align-self:flex-start;
    background:var(--wa-bubble-in);
    border-radius:8px;
    border-top-left-radius:0;
    padding: 10px 12px;
    display:flex;
    gap:4px;
    box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:#9AA5AA;
    animation: bounce 1.1s infinite;
  }
  .dot:nth-child(2){ animation-delay:.15s; }
  .dot:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5;}
    30%{ transform:translateY(-4px); opacity:1;}
  }
  .composer{
    flex-shrink:0;
    background:#F0F0F0;
    padding: 8px 10px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .composer .input{
    flex:1;
    background:white;
    border-radius:20px;
    padding: 9px 14px;
    color:#9AA5AA;
    font-size:13.5px;
  }
  .composer .send{
    width:34px;height:34px;border-radius:50%;
    background:var(--wa-header);
    display:flex;align-items:center;justify-content:center;
    color:white;
    font-size:15px;
  }
  .controls{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    width:380px;
    max-width:94vw;
  }
  .step-btn{
    width:100%;
    background: var(--wa-accent);
    color:#052E1D;
    border:none;
    padding: 13px 18px;
    border-radius: 10px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    transition: transform .08s ease, filter .15s ease;
  }
  .step-btn:hover{ filter:brightness(1.06); }
  .step-btn:active{ transform: scale(0.98); }
  .step-btn:disabled{
    background:#3B4A45;
    color:#8696A0;
    cursor:default;
  }
  .reset-btn{
    background:transparent;
    border:1px solid #3B4A45;
    color:#8696A0;
    padding:9px 16px;
    border-radius:8px;
    font-size:12.5px;
    cursor:pointer;
  }
  .progress{
    display:flex;
    gap:5px;
    margin-top:2px;
  }
  .pdot{
    width:6px;height:6px;border-radius:50%;
    background:#3B4A45;
  }
  .pdot.on{ background: var(--wa-accent); }
</style>
</head>
<body>

<div class="brand">
  <svg class="brand-logo" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
    <circle cx="340" cy="340" r="320" fill="#0B3B2E"/>
    <circle cx="150" cy="150" r="220" fill="#0F4A3A" clip-path="circle(320px at 340px 340px)"/>
    <text x="340" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="220" font-weight="700" fill="#F5FBF8">JC</text>
    <circle cx="478" cy="150" r="58" fill="#25D366"/>
    <path d="M 456 142 L 482 142 L 472 124 L 504 154 L 478 154 L 488 172 Z" fill="#0B3B2E"/>
  </svg>
  <span class="brand-name">Auto J Costa IA</span>
</div>
<div class="caption">DEMO — Agente de WhatsApp · Hamburgueria do Zé</div>

<div class="phone">
  <div class="header">
    <div class="avatar">🍔</div>
    <div class="info">
      <div class="name">Hamburgueria do Zé</div>
      <div class="status" id="status">online</div>
    </div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="composer">
    <div class="input">Mensagem</div>
    <div class="send">➤</div>
  </div>
</div>

<div class="controls">
  <button class="step-btn" id="stepBtn" onclick="nextStep()">▶ Iniciar conversa</button>
  <div class="progress" id="progress"></div>
  <button class="reset-btn" onclick="resetDemo()">Reiniciar demo</button>
</div>

<script>
const chat = document.getElementById('chat');
const stepBtn = document.getElementById('stepBtn');
const progressEl = document.getElementById('progress');
const statusEl = document.getElementById('status');

// Each step: { who: 'in'|'out', text, delay (ms of "typing" before it appears), receipt: optional array }
const steps = [
  { who:'out', text:'Oi, vi que vocês tem hambúrguer! Queria fazer um pedido' },
  { who:'in', delay:900, text:'Oi! 👋 Bem-vindo à Hamburgueria do Zé!\nAqui está nosso cardápio de hoje:\n\n🍔 *Hambúrgueres*\n1️⃣ Clássico — R$ 22\n2️⃣ Bacon Cheddar — R$ 27\n3️⃣ Duplo Zé — R$ 32\n\n🥤 *Bebidas*\n4️⃣ Refrigerante lata — R$ 6\n5️⃣ Suco natural — R$ 8\n\nÉ só responder o número do que quiser 😊' },
  { who:'out', text:'2 e 4 por favor' },
  { who:'in', delay:1100, text:'Show! Adicionei:\n🍔 1x Bacon Cheddar — R$ 27\n🥤 1x Refrigerante lata — R$ 6\n\nQuer adicionar mais algum item ou algum ajuste (ex: sem cebola, bacon extra)?' },
  { who:'out', text:'Sem cebola no lanche, só isso' },
  { who:'in', delay:900, text:'Anotado: *sem cebola* ✅\n\nÉ pra entrega ou retirada no balcão?' },
  { who:'out', text:'Entrega' },
  { who:'in', delay:900, text:'Perfeito! Pode me mandar o endereço com número e ponto de referência?' },
  { who:'out', text:'Rua das Palmeiras, 245 — perto da praça' },
  { who:'in', delay:1000, text:'Endereço confirmado ✅\n\nComo prefere pagar?\n💳 Cartão na entrega\n💵 Dinheiro\n🔑 Pix' },
  { who:'out', text:'Pix' },
  { who:'in', delay:1000, text:'Fechado! Aqui está o resumo do seu pedido 👇' },
  { who:'receipt', delay:700,
    title:'Pedido #0231',
    rows:[
      ['1x Bacon Cheddar (sem cebola)', 'R$ 27,00'],
      ['1x Refrigerante lata', 'R$ 6,00'],
      ['Taxa de entrega', 'R$ 5,00'],
    ],
    total: 'R$ 38,00'
  },
  { who:'in', delay:800, text:'💳 Chave Pix: hamburgueriadoze@pix.com\n\nAssim que o pagamento cair, o pedido já entra em preparo. Tempo estimado de entrega: *35-40 min* 🛵\n\nObrigado pela preferência! 🍔🔥' },
];

let currentStep = -1;
let busy = false;

function renderProgress(){
  progressEl.innerHTML = '';
  const totalDots = Math.min(steps.length, 14);
  for(let i=0;i<totalDots;i++){
    const d = document.createElement('div');
    d.className = 'pdot' + (i <= currentStep ? ' on' : '');
    progressEl.appendChild(d);
  }
}

function scrollDown(){
  chat.scrollTop = chat.scrollHeight;
}

function addBubble(step){
  if(step.who === 'receipt'){
    const div = document.createElement('div');
    div.className = 'bubble receipt';
    let rowsHtml = step.rows.map(r => `<div class="receipt-row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
    div.innerHTML = `<div class="receipt-title"><span>🧾 ${step.title}</span></div>${rowsHtml}<div class="receipt-total"><span>Total</span><span>${step.total}</span></div>`;
    chat.appendChild(div);
  } else {
    const div = document.createElement('div');
    div.className = 'bubble ' + step.who;
    div.innerHTML = escapeHtml(step.text).replace(/\*(.*?)\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
    const now = new Date();
    const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = time + (step.who === 'out' ? ' <span class="tick">✓✓</span>' : '');
    div.appendChild(meta);
    chat.appendChild(div);
  }
  scrollDown();
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  chat.appendChild(div);
  scrollDown();
}

function removeTyping(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

async function nextStep(){
  if(busy) return;
  busy = true;
  stepBtn.disabled = true;

  currentStep++;
  if(currentStep >= steps.length){
    stepBtn.textContent = '✅ Fim da demo';
    stepBtn.disabled = true;
    busy = false;
    return;
  }

  const step = steps[currentStep];

  if(step.who === 'in' || step.who === 'receipt'){
    statusEl.textContent = 'digitando...';
    showTyping();
    await new Promise(r => setTimeout(r, step.delay || 800));
    removeTyping();
    statusEl.textContent = 'online';
  }

  addBubble(step);
  renderProgress();

  if(currentStep < steps.length - 1){
    stepBtn.textContent = '▶ Próxima mensagem';
  }

  busy = false;
  stepBtn.disabled = false;
}

function resetDemo(){
  currentStep = -1;
  busy = false;
  chat.innerHTML = '';
  stepBtn.textContent = '▶ Iniciar conversa';
  stepBtn.disabled = false;
  statusEl.textContent = 'online';
  renderProgress();
}

renderProgress();
</script>

</body>
</html>
